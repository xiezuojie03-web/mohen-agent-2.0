<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>金泽 · 画布区域化样稿 v0.3（修订：中央区独立 + 时间拨回可点）</title>
<style>
  :root{--paper:#f5f0e8;--ink:#1a1a1a;--cinnabar:#9e2b25;--stone:#4a6741;--mist:#8b9189;--line:#c9c2b4;}
  *{box-sizing:border-box;} html,body{margin:0;height:100%;}
  body{height:100vh;height:100dvh; display:grid; grid-template-rows:auto 1fr auto; gap:12px;
    padding:16px clamp(12px,3vw,40px) 14px; background:linear-gradient(160deg,#f7f3ea,#efe9dc);
    color:var(--ink); font-family:"Noto Serif SC",Georgia,"Microsoft YaHei",serif; overflow:hidden;}

  /* 顶栏：用户语言的位置说明（无工程标识、无幕名） */
  .top{display:flex; align-items:baseline; gap:14px; border-bottom:1px solid var(--line); padding-bottom:10px;}
  .place{font-weight:700; letter-spacing:.18em; color:var(--cinnabar); font-size:18px;}
  .when{font-size:13px; color:var(--mist); font-family:"Microsoft YaHei",sans-serif;}
  .trail{display:flex; gap:8px; margin-left:auto;}
  .trail i{width:9px;height:9px;border-radius:50%; background:var(--line); display:block;}
  .trail i.done{background:var(--stone);}
  .trail i.cur{background:var(--cinnabar); box-shadow:0 0 0 3px rgba(158,43,37,.18);}

  /* 画布：唯一交互场，不滚动；两列 = 中央区 | 右侧栏 */
  .canvas{position:relative; height:100%; border:1px solid var(--line); border-radius:14px;
    background:#fffdf7; overflow:hidden;
    display:grid; grid-template-columns:1fr minmax(232px,30%); gap:14px; padding:14px; align-items:stretch;}

  /* 中央主角：独立成列，不再被任何浮层遮挡 */
  .center{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; min-height:0; min-width:0;}
  .center-label{font-size:12px; letter-spacing:.12em; color:var(--stone); text-align:center; font-family:"Microsoft YaHei",sans-serif;}
  .center-label span{display:block; font-size:10px; color:var(--mist); letter-spacing:0; margin-top:2px;}
  .sitemap{position:relative; width:100%; max-width:680px; aspect-ratio:4/3;
    background:repeating-linear-gradient(45deg,#f3efe6,#f3efe6 12px,#efe9dc 12px,#efe9dc 24px);
    border:1px solid var(--line); border-radius:12px;}
  .pt{position:absolute; transform:translate(-50%,-50%); text-align:center;}
  .pt .dot{width:14px;height:14px;border-radius:50%; background:var(--stone); border:2px solid #fff; margin:0 auto 3px;}
  .pt.c .dot{background:var(--cinnabar);}
  .pt b{font-size:12px; color:var(--ink); white-space:nowrap; font-family:"Microsoft YaHei",sans-serif;}
  .scale{position:absolute; left:12px; bottom:10px; font-size:11px; color:#5c625c; font-family:"Microsoft YaHei",sans-serif;}
  .scale .bar{display:inline-block; width:80px; height:4px; background:var(--ink); vertical-align:middle; margin-right:6px; border-radius:2px;}

  /* 右侧栏：钩子问题（顶部）+ 三张今貌（中部，可滚）+ 探索入口/墨痕（底部） */
  .side{position:relative; display:flex; flex-direction:column; gap:10px; min-height:0; min-width:0;
    border-left:1px dashed var(--line); padding-left:14px;}
  .hook{font-size:15px; line-height:1.55; color:#2a2f27; background:rgba(255,253,247,.92); border:1px solid var(--line);
    border-radius:10px; padding:9px 12px; font-family:"Microsoft YaHei",sans-serif;}
  .hook small{display:block; font-size:12px; color:var(--mist); margin-top:4px; line-height:1.5;}
  .strip{display:flex; flex-direction:column; gap:8px; overflow:auto; min-height:0; flex:1; padding-right:2px;}
  .strip figure{margin:0; display:flex; gap:8px; align-items:center; background:#faf6ec; border:1px solid var(--line); border-radius:8px; padding:5px;}
  .strip img{width:92px; height:62px; object-fit:cover; border-radius:6px; border:1px solid var(--line); flex:none; background:#e7e0d2;}
  .strip figcaption{font-size:11px; color:#55605b; font-family:"Microsoft YaHei",sans-serif;}

  /* 底部：探索入口 + 墨痕，二者相邻（用户要的「墨痕附近能进一步探索」） */
  .rail{display:flex; flex-direction:column; align-items:stretch; gap:8px; flex:none;}
  .act{background:var(--ink); color:var(--paper); border:1px solid var(--ink); border-radius:999px;
    padding:10px 16px; font-size:13px; cursor:pointer; font-family:inherit; white-space:nowrap;
    box-shadow:0 4px 12px rgba(26,26,26,.18); transition:transform .08s ease, background .15s ease;}
  .act:hover{background:#000;}
  .act:active{transform:scale(.97);}
  .act:disabled{opacity:.45; cursor:not-allowed; box-shadow:none;}
  .reset{background:transparent; color:var(--mist); border:1px dashed var(--line); border-radius:999px;
    padding:5px 12px; font-size:12px; cursor:pointer; font-family:"Microsoft YaHei",sans-serif; align-self:center; display:none;}
  .mohen{display:flex; align-items:center; gap:8px; justify-content:flex-end;}
  .mohen .line{font-size:12px; color:var(--ink); background:rgba(255,253,247,.95); border:1px dashed rgba(158,43,37,.4);
    border-radius:999px; padding:5px 11px; font-family:"Microsoft YaHei",sans-serif; max-width:200px; text-align:right;}
  .ask{width:38px;height:38px;border-radius:50%; border:1px solid var(--cinnabar); background:var(--cinnabar); color:#fff;
    font-size:13px; cursor:pointer; box-shadow:0 4px 14px rgba(158,43,37,.28); flex:none;}

  /* 墨痕追问卡：同锚点右下，向上展开，带收起 */
  .dialog{position:absolute; right:14px; bottom:14px; z-index:9; width:min(340px,80%);
    background:rgba(255,253,247,.98); border:1px solid rgba(58,63,55,.22); border-radius:12px; padding:12px;
    box-shadow:0 8px 28px rgba(26,26,26,.16); display:none;}
  .dialog.show{display:block;}
  .dialog h4{margin:0 0 8px; font-size:12px; letter-spacing:.2em; color:var(--cinnabar); border:1px dashed var(--cinnabar);
    border-radius:999px; padding:2px 10px; display:flex; align-items:center; gap:8px; font-family:"Microsoft YaHei",sans-serif;}
  .dialog .x{border:none; background:transparent; color:var(--mist); cursor:pointer; font-size:12px; font-family:"Microsoft YaHei",sans-serif; margin-left:auto;}
  .dialog input{width:100%; padding:9px 10px; font:inherit; font-size:14px; border:1px solid rgba(58,63,55,.3); border-radius:8px; margin-bottom:8px;}
  .dialog .sug{font-size:12px; color:var(--mist); font-family:"Microsoft YaHei",sans-serif;}
  .dialog .sug b{color:var(--stone);}

  /* 底栏：用户语言的「此刻含义」说明（非控件、非工程） */
  .bottom{display:flex; align-items:center; gap:12px; border-top:1px solid var(--line); padding-top:10px;
    font-size:13px; color:#565d57; font-family:"Microsoft YaHei",sans-serif;}
  .bottom .tag{color:var(--stone);}

  /* 窄屏（手机竖屏）：右侧栏移到中央区下方，照片转横向滚动 */
  @media (max-width:680px){
    .canvas{grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto; padding:12px; gap:12px;}
    .center{justify-content:flex-start; padding-top:4px;}
    .side{border-left:none; border-top:1px dashed var(--line); padding-left:0; padding-top:10px;}
    .strip{flex-direction:row; overflow-x:auto; overflow-y:hidden; flex:none;}
    .strip figure{flex:none; flex-direction:column; width:104px;}
    .strip img{width:92px; height:62px;}
  }
  /* 矮屏（横屏手机）：两列保留，缩小边距与字号 */
  @media (max-height:600px){
    body{padding:10px clamp(10px,2vw,24px) 8px; gap:8px;}
    .canvas{padding:10px; gap:10px;}
    .side{padding-left:10px;}
    .hook{font-size:13px; padding:7px 10px;}
    .sitemap{aspect-ratio:16/10;}
  }
</style>
</head>
<body>
  <!-- 顶栏：金泽 · 今天（用户语言位置） + 轨迹 -->
  <div class="top">
    <span class="place">金泽</span>
    <span class="when" id="when">今天 · 你正站在这里</span>
    <div class="trail" id="trail"><i class="cur"></i><i></i><i></i><i></i><i></i></div>
  </div>

  <!-- 画布：唯一交互场 -->
  <main class="canvas">
    <!-- 中央主角：独立成列，明确组件身份 -->
    <section class="center">
      <div class="center-label" id="centerLabel">主角 Surface · 今址三点图<span>真实坐标推导，非伪造 GIS</span></div>
      <div class="sitemap" aria-label="真实场地：三处宋构相对位置（由真实坐标推导）">
        <div class="pt c" style="left:50%; top:50%;"><span class="dot"></span><b>颐浩寺遗址</b></div>
        <div class="pt" style="left:24%; top:36%;"><span class="dot"></span><b>万安桥</b></div>
        <div class="pt" style="left:76%; top:64%;"><span class="dot"></span><b>普济桥</b></div>
        <div class="scale"><span class="bar"></span>约 620 m（按真实坐标估读）</div>
      </div>
    </section>

    <!-- 右侧栏：钩子问题 + 三张今貌 + 探索入口/墨痕 -->
    <aside class="side">
      <div class="hook" id="hook">为什么三处宋构离得这么近？<small>墨痕：这不是已有答案的问题——往时间里找。</small></div>
      <div class="strip">
        <figure><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Wan'anqiao.jpg?width=300" alt="万安桥"/><figcaption>万安桥</figcaption></figure>
        <figure><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Pujiqiao_(Jinze).jpg?width=300" alt="普济桥"/><figcaption>普济桥</figcaption></figure>
        <figure><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Yihaosi_Yizhi.jpg?width=300" alt="颐浩寺遗址"/><figcaption>颐浩寺遗址</figcaption></figure>
      </div>
      <div class="rail">
        <button class="act" id="backBtn">把时间拨回去 →</button>
        <button class="reset" id="resetBtn">↺ 回到今天</button>
        <div class="mohen">
          <span class="line">墨痕 · 这一问要往时间里找答案</span>
          <button class="ask" id="askBtn">墨痕</button>
        </div>
      </div>
    </aside>

    <!-- 墨痕追问卡 -->
    <div class="dialog" id="dialog">
      <h4>问墨痕 <button class="x" id="closeBtn">收起</button></h4>
      <input placeholder="寺和桥真的有关系吗？" />
      <div class="sug">或先用右侧「把时间拨回去 →」继续主线</div>
    </div>
  </main>

  <!-- 底栏：用户语言的此刻含义 -->
  <footer class="bottom" id="bottom"><span class="tag">此刻</span> 三处宋构都还在原址，彼此不到一公里——这是这一站要回答的问题。</footer>

  <script>
    // 五幕时间轴：点击「把时间拨回去」逐幕向早推进，演示「进一步探索」真能走
    const BEATS=[
      {when:'今天 · 你正站在这里', hook:'为什么三处宋构离得这么近？', mohen:'这不是已有答案的问题——往时间里找。',
       era:'今址三点图（按真实坐标）', meaning:'三处宋构都还在原址，彼此不到一公里——这是这一站要回答的问题。'},
      {when:'1992 · 颐浩禅寺重建', hook:'寺被毁后半个世纪，为何在原址重建？', mohen:'重建不是巧合，是地名与记忆的延续。',
       era:'1992 · 原址重建', meaning:'1992 年寺院于原址重建，说明「这里」从未被遗忘。'},
      {when:'1938 · 寺院被毁', hook:'一场劫难如何改变了这片水网的焦点？', mohen:'被毁的不是一座庙，是一处聚落的圆心。',
       era:'1938 · 被毁前', meaning:'1938 寺院被毁，水网仍在，但圆心消失。'},
      {when:'1342 · 万安桥始建', hook:'桥为何选在这条水道的交叉口？', mohen:'桥是水网的交点，也是人的交点。',
       era:'1342 · 万安桥', meaning:'1342 万安桥建成，定下这片水网的第一颗钉。'},
      {when:'1260s · 普济桥与南宋市集', hook:'更早的桥，如何引来市集与人群？', mohen:'有桥就有渡，有渡就有市。',
       era:'1260s · 普济桥', meaning:'1260 年代普济桥与南宋市集，水网初成。'},
    ];
    let i=0;
    const $=s=>document.querySelector(s);
    const backBtn=$('#backBtn'), resetBtn=$('#resetBtn');
    function render(){
      const b=BEATS[i];
      $('#when').textContent=b.when;
      document.querySelectorAll('#trail i').forEach((d,j)=>{ d.className = j<i?'done':(j===i?'cur':''); });
      $('#hook').innerHTML = b.hook + '<small>墨痕：'+b.mohen+'</small>';
      $('#centerLabel').innerHTML = '主角 Surface · 今址三点图<span>'+b.era+'</span>';
      $('#bottom').innerHTML = '<span class="tag">此刻</span> '+b.meaning;
      const atEnd = i>=BEATS.length-1;
      backBtn.disabled = atEnd;
      backBtn.textContent = atEnd ? '已到最早年代' : '把时间拨回去 →';
      resetBtn.style.display = i>0 ? 'inline-block' : 'none';
    }
    backBtn.onclick=()=>{ if(i<BEATS.length-1){ i++; render(); } };
    resetBtn.onclick=()=>{ i=0; render(); };
    const askBtn=$('#askBtn'), dlg=$('#dialog'), closeBtn=$('#closeBtn');
    askBtn.onclick=()=>dlg.classList.add('show');
    closeBtn.onclick=()=>dlg.classList.remove('show');
    render();
  </script>
</body>
</html>
