e">查看依据</button><button id="backContent" hidden>返回讲述</button></div><form class="ask" id="ask"><input id="question" aria-label="向墨痕提问" placeholder="例如：沿街道看呢？"><button type="submit">提问</button></form></footer><div id="corner" class="resize-corner" aria-label="缩放悬浮面板"></div></aside></div><div class="peek" id="peek" role="status"><small>墨痕 · 发现一个问题</small><strong id="peekText"></strong></div></div><p class="notice">可操作：唤醒、悬浮／分区、拖移、尺寸、收起、依据返回、逐镜头、对照切换、锚点与图层。提问使用本地示范回应，未接入真实 Agent 或 GIS。</p></main><section class="atlas" id="atlas"></section><script>

function renderArt(){const f=FRAMES[current];let s=f.scene,out='',controls='';const box=(content,cap='',cls='')=>`<div class="artbox ${cls}">${content}${cap?`<span class="caption">${cap}</span>`:''}</div>`;
 if(['scene','focus','return'].includes(s))out=box(sceneArt(false,s!=='scene'),'眼前 · 观察示意');
 else if(s==='missing'){controls='<button data-op="return-present">回到今日观察</button>';out='<div class="missing"><small>先保留这个问题</small><h2>这件旧材料还不能展示</h2><p>原件尚不可读或使用条件未核定。你仍可回到今日观察，看看桥头与街口怎样连接。</p></div>';}
 else if(['original','detail'].includes(s)){out=box(`<div style="width:100%;height:100%;transform:scale(${zoom});transform-origin:center">${paper(s==='detail')}</div>${s==='detail'?`<div class="mini-map">${svg(mapArt(true)+'<rect x="270" y="145" width="450" height="300" fill="none" stroke="#b45535" stroke-width="9"/>')}</div>`:''}`,s==='detail'?'局部 · 原件示意':'原件全貌 · 示意');controls='<button data-op="zoomout">− 缩小</button><button data-op="zoomin">＋ 放大</button><button data-op="zoomreset">全貌复位</button>';if(s==='original')controls+='<button data-op="detail">看局部</button>';out+='<div class="map-key">原图方向与比例不可直接用于今日导航</div>'}
 else if(['compare','anchor'].includes(s)){const anchorMode=s==='anchor';let today=anchorMode?svg(mapArt(false,{anchors:true})):sceneArt(false),past=anchorMode?svg(mapArt(true,{anchors:true})):sceneArt(true,false,1);out=`<div class="compare-wrap">${box(side==='today'?today:past,side==='today'?'今日 · 主画面':'旧材料 · 主画面','main-picture')}${box(side==='today'?past:today,side==='today'?'旧材料参照':'今日参照','ref-picture')}</div>`;controls=`<button data-op="today" class="${side==='today'?'active':''}">今日</button><button data-op="past" class="${side==='past'?'active':''}">旧材料</button>`;if(anchorMode)controls+=`<button data-op="anchor1" class="${anchor===1?'active':''}">锚点①</button><button data-op="anchor2" class="${anchor===2?'active':''}">锚点②</button>`;out+=`<div class="map-key">${anchorMode?'同号仅表示对象对应 · 点锚点看依据':'示意素材不可作真实历史比较 · 视角差异需核验'}</div>`}
 else if(s==='relation') {out=box(svg(mapArt(false,{relations:layer,street:current===9||!!question,focus:true})),'桥头 · 关系观察');controls=`<button data-op="layer">${layer?'隐藏':'显示'}关系</button><button data-op="relation">关系依据</button>`;out+='<div class="map-key">虚线：待核关系 · 不是已证实的因果</div>'}
 else if(s==='sequence'){out=box(sceneArt(false,shot>0,shot),['镜头一 · 水边','镜头二 · 桥头','镜头三 · 街口'][shot]);controls=[0,1,2].map(i=>`<button data-op="shot${i}" class="${shot===i?'active':''}">${i+1} ${['水边','桥头','街口'][i]}</button>`).join('')}
 else if(s==='route'){out=box(svg(mapArt(false,{focus:true})+`<path d="M295 432 L475 287 L790 143" fill="none" stroke="#ad6746" stroke-width="4" stroke-dasharray="8 8"/>`+[ [295,432],[475,287],[790,143]].map(([x,y],i)=>`<g data-op="shot${i}" role="button" tabindex="0" aria-label="查看观察点${i+1}"><circle cx="${x}" cy="${y}" r="${shot===i?28:17}" fill="${shot===i?'#ac5836':'#6b8065'}"/>${text(x-7,y+6,''+(i+1),20,'white')}</g>`).join('')),'观察清单 · 非导航路线');controls=[0,1,2].map(i=>`<button data-op="shot${i}" class="${shot===i?'active':''}">${['水边','桥头','街口'][i]}</button>`).join('')}
 else if(['global','local','reconstruction'].includes(s)){let inner=mapArt(false);if(s==='global'){inner+=`<g class="old-layer" opacity="${alpha}">${mapArt(true)}</g>`;out=box(svg(inner),'整幅叠加 · 机制示意');out+='<div class="map-key">年代／来源／误差：演示未提供 · 生产不可启用</div>';}

function operate(op){if(op==='scene-focus'){if(FRAMES[current].scene==='sequence'){shot=(shot+1)%3;renderArt();return}if(current===0||current===1){presence=current===0?'peek':'open';go(current+1);return}presence='open';layout();return}if(op==='return-present'){go(10);return}if(op==='today'||op==='past')side=op;else if(op.startsWith('shot'))shot=Number(op.slice(-1));else if(op.startsWith('anchor')){anchor=Number(op.slice(-1));presence='open';evidence=true;}else if(op==='layer')layer=!layer;else if(op==='relation'){presence='open';evidence=true;}else if(op==='zoomin')zoom=Math.min(2.4,zoom+.2);else if(op==='zoomout')zoom=Math.max(.8,zoom-.2);else if(op==='zoomreset')zoom=1;else if(op==='detail'){go(4);return}renderArt();renderPanel();layout();}
function renderPanel(){const f=FRAMES[current];$('#backContent').hidden=!evidence;$('#evidence').hidden=evidence;$('#body').innerHTML=evidence?`<div class="eyebrow">依据 · 当前对象</div><h2>${f.scene==='anchor'?'锚点 '+anchor+' 的对应依据':'这幅画面能支持什么？'}</h2><div class="source-box"><strong>本页是施工示意，没有真实史料</strong><br>来源：本原型自绘几何<br>原文／馆藏编号：未提供<br>年代：不对应任何真实历史时期<br>方法：${spaceNames[f.space]}的界面演示<br>置信度：不可用于事实输出<br>权利：真实材料须另行核定</div><p style="margin-top:12px">生产版此处绑定当前对象的出处、原文定位与判断边界。没有这些材料，就不输出对应的历史结论。</p>`:`<div class="eyebrow">${f.group==='叙事逐帧'?'水边的一次停留':'体验样板'}</div><h2>${f.question}</h2><p>${question?'你问：“'+escapeHtml(question)+'”<br>我们留在这处桥头，只把街道方向提亮。这是固定示范回应，尚未接入 Agent。':f.copy}</p>${f.id==='U07'?'<p>你可以回到现场观察；缺少材料不会生成虚构旧影或伪造出处。</p>':''}`;$('#peekText').textContent=f.question;}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function layout(){const p=portrait(),size=sizes[p?'portrait':'landscape'];
 $('#shell').style.setProperty('--w',sizes.landscape+'%');$('#shell').style.setProperty('--h',sizes.portrait+'%');
 $('#layout').className='layout'+(presence!=='open'?' closed':'')+(floating&&presence==='open'?' floating':'');
 $('#peek').hidden=presence!=='peek';$('#peek').style.display=presence==='peek'?'block':'none';
 $('#wake').textContent=presence==='open'?'墨痕 · 收起':'墨痕 · 展开';$('#wake').setAttribute('aria-expanded',presence==='open');
 $('#float').textContent=floating?'切为分区':'切为悬浮';$('#float').setAttribute('aria-label',floating?'墨痕当前为悬浮，切为分区':'墨痕当前为分区，切为悬浮');
 $('#sizeReadout').textContent=size+'%'+(p&&size/100*($('#layout').clientHeight||798)<230?' · 可读保护':'');
 $('#dock').hidden=!floating||!p;$('#drag').setAttribute('aria-disabled',!floating);
 $('#splitter').setAttribute('aria-valuenow',size);$('#splitter').setAttribute('aria-valuemax',p?48:42);$('#splitter').setAttribute('aria-orientation',p?'horizontal':'vertical');
 if(floating&&p&&bottom){$('#panel').style.top='auto';$('#panel').style.bottom='12px'}
 $('#dock').textContent=bottom?'移到上方':'移到下方';
}
function savePreference(){if(sample)return;try{localStorage.setItem('mohen-v091-layout',JSON.stringify({floating,sizes}))}catch(e){}}

const snapshots=new Map();let initialized=false;
function go(index,restore=false){
 if(initialized)snapshots.set(current,{evidence,side,anchor,shot,zoom,alpha,layer,question,scroll:$('#readingScroll').scrollTop});

}

$('#smaller').onclick=()=>setSize(sizes[portrait()?'portrait':'landscape']-2);$('#larger').onclick=()=>setSize(sizes[portrait()?'portrait':'landscape']+2);

function pointerDrag(el,handler){el.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();el.setPointerCapture(e.pointerId);const initial={x:e.clientX,y:e.clientY,rect:$('#panel').getBoundingClientRect(),container:$('#layout').getBoundingClientRect()};const move=ev=>handler(ev,initial);const end=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);el.removeEventListener('pointercancel',end)};el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)})}
pointerDrag($('#splitter'),(e,i)=>setSize(portrait()?(e.clientY-i.container.top)/i.container.height*100:(i.container.right-e.clientX)/i.container.width*100));
pointerDrag($('#drag'),(e,i)=>{if(!floating)return;const panel=$('#panel'),x=Math.max(8,Math.min(i.container.width-i.rect.width-8,i.rect.left-i.container.left+e.clientX-i.x)),y=Math.max(8,Math.min(i.container.height-i.rect.height-8,i.rect.top-i.container.top+e.clientY-i.y));panel.style.left=x+'px';panel.style.top=y+'px';panel.style.right='auto';panel.style.bottom='auto'});
pointerDrag($('#corner'),(e,i)=>{if(!floating)return;const p=$('#panel');p.style.width=Math.min(i.container.right-i.rect.left-8,Math.max(270,i.rect.width+e.clientX-i.x))+'px';p.style.height=Math.min(i.container.bottom-i.rect.top-8,Math.max(230,i.rect.height+e.clientY-i.y))+'px'});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(evidence){evidence=false;renderPanel()}else{presence='hidden';layout();$('#wake').focus()}}});
function showExperience(){document.body.classList.remove('atlas-mode');$('#experience').classList.add('active');$('#atlasBtn').classList.remove('active')}
let atlasBuilt=false;function showAtlas(){document.body.classList.add('atlas-mode');$('#atlasBtn').classList.add('active');$('#experience').classList.remove('active');if(!atlasBuilt){$('#atlas').innerHTML=`<div class="atlas-top"><small>DRAWING REGISTER / 29 SHEETS / 58 VIEWS</small><h1>逐页、逐帧，交代画面如何改变</h1><p>图册展示各帧的独立状态样板；实际连续探索不会照样板自动切换显隐或布局。编号是施工定位，不是产品菜单。每页左侧 1440 × 900 横屏，右侧 390 × 844 竖屏。点击“操作这一帧”可验证具体交互。原型没有真实历史证据；五种空间表达是按材料条件选择的分支，不是故事必走的五步。</p><div class="atlas-index">${FRAMES.map(f=>`<a href="#sheet-${f.id}">${f.id} ${f.title}</a>`).join('')}</div></div>`+FRAMES.map((f,i)=>`<article class="sheet" id="sheet-${f.id}"><header class="sheet-head"><span class="serial">${f.id}</span><h2>${f.title}</h2><small>${f.group} · ${f.comp} ${compNames[f.comp]} · ${spaceNames[f.space]}</small></header><div class="screens"><div><div class="screen-title">横屏 · 1440 × 900 / 左舞台、右墨痕</div><div class="desktop-shot"><iframe loading="lazy" title="${f.id}横屏" src="?embed=1&sample=1&frame=${f.id}"></iframe></div></div><div><div class="screen-title">竖屏 · 390 × 844 / 上墨痕、下舞台</div><div class="phone-shot"><iframe loading="lazy" title="${f.id}竖屏" src="?embed=1&sample=1&frame=${f.id}"></iframe></div></div></div><div class="spec"><div><b>① 用户看见什么</b>${f.focus}</div><div><b>② 相对上一帧如何变化</b>${f.delta}</div><div><b>③ 点击位置与结果</b>${f.action}</div><div><b>④ 墨痕与返回</b>${{hidden:'隐身，仅保留上方唤醒入口',peek:'轻提示，不占分区；从右上控制区展开',open:'展开；显隐和布局在右上同一控制区，尺寸与场景操作在墨痕内'}[f.presence]}；这是独立示意初态，连续探索继承用户的显隐、布局和尺寸；上一步只恢复内容。</div><div><b>⑤ 资料不足</b>${f.fallback}</div><div><b>⑥ 本帧验收</b>盖住文字仍能辨认 ${compNames[f.comp]}；横竖屏均只有一个主焦点。真实材料、触控键盘、Agent 与 GIS 不在本次通过范围。</div></div><button class="open-frame" onclick="showExperience();go(${i});window.scrollTo(0,0)">操作这一帧 →</button></article>`).join('');atlasBuilt=true;new ResizeObserver(()=>scaleShots()).observe($('#atlas'))}requestAnimationFrame(scaleShots)}
