<text x="1110" y="368" text-anchor="middle" class="serif" font-size="25">运河之上，烟火人间</text><text x="1110" y="394" text-anchor="middle" class="small muted">——江南水乡的日常与诗意</text>
<rect x="832" y="415" width="558" height="150" rx="10" fill="url(#water)"/>
<path d="M832 495 Q930 467 1030 495 T1230 492 T1390 480V565H832Z" fill="#9bb6a7"/><path d="M832 455L875 432 920 455V510H832ZM1280 454L1327 425 1370 454V510H1280Z" fill="#f3ecdc" stroke="#a4b3a5" stroke-width="3"/><path d="M825 454L875 425 927 455M1270 455L1327 418 1380 455" fill="none" stroke="#718a7d" stroke-width="8"/><path d="M1035 498Q1110 555 1190 498" fill="none" stroke="#e9e3d5" stroke-width="17"/><path d="M832 540Q1000 516 1160 540T1390 534" fill="none" stroke="#dbe8dd" stroke-width="2"/><rect x="1296" y="428" width="82" height="20" rx="10" fill="#fffdf0" opacity=".9"/><text x="1305" y="442" class="tiny muted">场景示意</text>
<text x="832" y="597" class="small serif">大运河不仅是一条水道，更是一条连接城镇与百姓生活的文化脉络。</text>
<rect x="832" y="621" width="558" height="76" rx="8" fill="#f3f7f2" stroke="#d7e7db"/><rect x="832" y="621" width="4" height="76" rx="2" fill="#1c5a55"/><text x="850" y="647" class="mid serif">一、河道如何进入城镇生活</text><text x="850" y="674" class="small muted">水路改变了沿岸交通条件，也为货物流通和市镇发展提供空间联系。</text>
<text x="850" y="729" class="mid serif">二、沿河的人们如何谋生</text><text x="850" y="754" class="small muted">船户、商贩、工匠与沿岸居民的生活节奏，仍需材料逐项核实。</text>
