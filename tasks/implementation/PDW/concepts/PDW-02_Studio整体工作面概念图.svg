<text x="408" y="474" class="small" font-weight="700">研究事件流</text><circle cx="420" cy="503" r="5" fill="#1c5a55"/><text x="437" y="507" class="small">材料交叉比对</text><text x="437" y="525" class="tiny muted">地方志记载与沿线城镇资料正在核对</text><circle cx="420" cy="556" r="5" fill="#83a792"/><text x="437" y="560" class="small">发现可追问的关系</text><text x="437" y="578" class="tiny muted">水运节点与市镇活动可能有关，仍需活动证据</text>
<circle cx="420" cy="610" r="5" fill="#c3cec5"/><text x="437" y="614" class="small">整理研究缺口</text><text x="437" y="632" class="tiny muted">居民日常生活的细节材料仍不足</text>
<rect x="408" y="669" width="365" height="146" rx="10" fill="#fbf2e2" stroke="#efe2c9"/><text x="426" y="699" class="small" fill="#95672e" font-weight="700">研究缺口 · 需要继续补证</text><text x="426" y="727" class="small">当前材料足以提出城镇与水路的</text><text x="426" y="749" class="small">空间关系，但尚不足以证明具体</text><text x="426" y="771" class="small">商业活动的因果机制。</text><text x="426" y="797" class="tiny muted">可继续寻找账簿、契约或地方档案。</text></g>
