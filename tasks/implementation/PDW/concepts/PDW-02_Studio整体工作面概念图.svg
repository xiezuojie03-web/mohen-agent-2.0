<rect x="43" y="371" width="312" height="197" rx="11" fill="url(#mist)" stroke="#dbe7dc"/><text x="59" y="399" class="small teal" font-weight="700">墨痕 · 研究伙伴</text><text x="59" y="428" class="small">我已初步梳理了研究方向。</text><text x="59" y="451" class="small">下一步建议明确：你更希望从</text><text x="59" y="474" class="small">水运与城镇形成切入，还是从</text><text x="59" y="497" class="small">沿河居民的日常生活切入？</text><rect x="59" y="518" width="108" height="30" rx="7" fill="#1c5a55"/><text x="78" y="538" font-size="11" fill="white">聚焦前者</text><rect x="176" y="518" width="108" height="30" rx="7" fill="#fffefa" stroke="#b7ccc0"/><text x="195" y="538" class="tiny teal">两者都要</text>
