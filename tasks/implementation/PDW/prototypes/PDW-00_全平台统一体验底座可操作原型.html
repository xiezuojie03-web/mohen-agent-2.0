home:{name:"HOME",label:"发现世界",title:"从一条河，发现城市与日常生活的关系",lead:"在同一个历史文化世界里，从地方、器物、人物、典籍和遗址出发，发现过去如何塑造今天。",service:"发现引导：解释当前策展主题与对象之间的联系，提出有依据的继续发现方向。",observation:"你正在浏览一个由时间、空间与生活线索组织起来的历史文化世界。",interpretation:"不同地方、器物与日常经验可以放在同一时代脉络中观察，而不是被拆成互不相关的知识条目。",next:["沿着当前主题进入探索","比较同一时期的其他地方"],kind:"world"},
exp:{name:"EXP",label:"探索",title:"围绕一个问题，展开证据、关系与比较",lead:"探索工作台把问题、研究过程、关系线索与证据呈现连接起来；叙事舞台和证据面板按需展开。",service:"探索协作：解释证据、比较对象、识别争议与缺口；区分事实、解释、假说和未知。",observation:"当前探索由问题与焦点对象组织，叙事呈现和证据呈现可以分别控制。",interpretation:"证据面板服务于当前判断，不与探索舞台争夺主位；布局可随任务变化，不固定为永久三栏。",next:["继续当前问题","将当前探索带入Studio"],kind:"exp"},
studio:{name:"Studio",label:"研究与创作",title:"把一个问题，发展成有依据、可继续修改的作品",lead:"研究室与创作编辑部。创作者表达目标，墨痕组织研究、来源、证据与创作方向，用户保留关键判断和授权。",service:"创作协作：在当前项目与授权范围内理解委托、组织研究、呈现发现、比较方案并协助形成作品。",observation:"当前工作空间保留对话委托、研究进展与作品构思三个既有工作区域。",interpretation:"内部生产链由墨痕承担组织；用户重点处理创作目标、关键选择、授权和作品修改。",next:["继续当前研究","查看研究底稿"],kind:"studio"},
watch:{name:"WATCH",label:"观看",title:"让作品、章节与依据共同构成观看体验",lead:"WATCH消费当前合法发布的精确作品修订。观看舞台保持沉浸，作品简介、章节与依据作为辅助信息。",service:"观看陪伴：解释当前公开作品的章节、术语与出处；不读取创作者私有项目，不扩大消费权限。",observation:"观看以作品修订和当前章节为中心，章节轴、播放控制和作品信息共同服务于阅读节奏。",interpretation:"观看中的历史问题可以进入EXP继续探索，但返回时应恢复原作品修订与章节位置。",next:["解释当前章节","从当前作品进入探索"],kind:"watch"},
admin:{name:"Admin",label:"治理",title:"让每一项治理判断都有对象、依据与责任人",lead:"面向Reviewer与Operator的治理工作面。审核、发布、知识资产、权限和运行状态各有明确职责。",service:"治理辅助：归纳当前治理对象、解释来源与权利风险、指出缺口并准备可审阅建议；不能代签Gate、代批或代发布。",observation:"治理任务围绕精确作品修订、提交快照、知识资产、权利与权限变更展开。",interpretation:"墨痕提供有依据的分析与建议，最终裁决和运营动作由具名授权角色承担。",next:["归纳当前待审材料","检查来源与权利"],kind:"admin"},
personal:{name:"个人空间",label:"我的空间",title:"把探索、收藏、研究与作品，连成自己的长期脉络",lead:"个人空间聚合用户自己的探索记录、创作项目、作品与个人收藏；私人笔记和长期上下文由用户决定是否授权。",service:"个人助理：帮助整理本人主动保存的探索、收藏、笔记和项目；不把浏览轨迹默认转成画像，不跨项目共享私有资料。",observation:"个人空间连接探索、创作与观看中的个人成果，不另建项目或作品的第二事实源。",interpretation:"个人资产与正式知识资产分开；私人资料默认不进入墨痕上下文，分享与授权均由用户控制。",next:["继续上次的探索","整理个人收藏"],kind:"personal"}
};
const order=["home","exp","studio","watch","admin"];
let current="home",role="creator",muted=false,offline=false,context={origin:"HOME",object:"当前发现主题",question:"过去如何塑造今天的生活？",trail:["HOME"],returnTo:"HOME"};
const nav=document.getElementById("nav"),mobile=document.getElementById("mobilebar"),page=document.getElementById("page");
function roleName(){return {visitor:"访客",creator:"Creator · 创作者",reviewer:"Reviewer · 审核",operator:"Operator · 运营"}[role]}
function permitted(k){if(k==="admin")return role==="reviewer"||role==="operator";if(k==="studio")return role==="creator";if(k==="personal")return role!=="visitor";return true}
function go(k){if(!permitted(k)){agentSay(k==="admin"?"当前账户没有治理工作面的访问权限。请使用获授权的Reviewer或Operator账户。":k==="studio"?"进入Studio需要Creator身份，请先登录并确认账户角色。":"个人空间需要登录后查看。");openAgent();return}
if(k==="studio"&&current==="exp"){context.origin="EXP";context.returnTo="EXP";context.object="当前探索对象与问题"}
if(k==="exp"&&current==="watch"){context.origin="WATCH";context.returnTo="WATCH";context.object="当前作品修订与章节锚点"}
if(k==="exp"&&current==="home"){context.origin="HOME";context.returnTo="HOME";context.object="当前发现主题与对象"}
current=k;if(!context.trail.length||context.trail[context.trail.length-1]!==k.toUpperCase())context.trail.push(k.toUpperCase());draw();updateAgent();window.scrollTo({top:0,behavior:"smooth"})}
function drawNav(){nav.innerHTML="";mobile.innerHTML="";order.filter(k=>k!=="admin"||role==="reviewer"||role==="operator").forEach(k=>{let b=document.createElement("button");b.textContent=pages[k].name;b.className=current===k?"active":"";b.onclick=()=>go(k);nav.append(b);let m=document.createElement("button");m.innerHTML="<b>"+pages[k].name+"</b><span>"+pages[k].label+"</span>";m.className=current===k?"active":"";m.onclick=()=>go(k);mobile.append(m)})}
function homePage(){return '<div class="page-kicker">MOHEN · 历史文化世界</div><div class="home-feature"><div class="home-feature-copy"><span class="pill"><i class="dot"></i>发现情境 · 江河与城市</span><h2>一条河，如何塑造一座城市的生活？</h2><p>从水岸、道路、市场与居住空间出发，把历史地理与普通人的日常重新联系起来。</p><div class="actions"><button class="btn primary" id="enterExp">进入探索</button><button class="btn soft" id="askPage">问墨痕</button></div></div><div class="feature-visual"><div class="feature-caption"><strong>江河与城市</strong><span>时间 · 空间 · 生活</span></div></div></div><div class="section-head"><h2>从不同视角进入同一个世界</h2><p>视角可以交叠，不是互斥分类</p></div><div class="topic-row"><button class="active">漫游全部</button><button>江河与城市</button><button>器物与生活</button><button>文明与遗迹</button><button>文字与思想</button><button>艺术与人物</button><button>交流与远行</button></div><div class="editorial-grid"><article class="editorial-card"><div class="editorial-image"></div><div class="editorial-copy"><small>地图 · 城市 · 水岸</small><h3>城市与河流的旧时关系</h3><p>从地图与地方记载出发，观察水系、交通与聚落之间的变化。</p><button class="btn small" data-enter="exp">沿此发现</button></div></article><article class="editorial-card"><div class="editorial-image"></div><div class="editorial-copy"><small>器物 · 技艺 · 日常</small><h3>一件器物里的生活史</h3><p>器物不只是年代标签，也记录着材料、技艺、使用与交流。</p><button class="btn small" data-enter="exp">沿此发现</button></div></article><article class="editorial-card"><div class="editorial-image"></div><div class="editorial-copy"><small>典籍 · 文字 · 思想</small><h3>古人如何记录他们的世界</h3><p>从文本、书影与时代语境中，辨认记忆如何被保存和改写。</p><button class="btn small" data-enter="exp">沿此发现</button></div></article></div><div class="home-lower"><section class="world-panel"><h3>继续打开历史的不同尺度</h3><div class="world-links"><button data-enter="exp"><b>人物与时代</b><span>个体经历与时代结构</span></button><button data-enter="exp"><b>地方与迁徙</b><span>地理空间与人口流动</span></button><button data-enter="exp"><b>同一时代的世界</b><span>跨地域比较与联系</span></button></div></section><section class="continue-panel"><h3>继续发现</h3><p>从一个对象、一段记载或一个问题开始，让不同线索逐渐形成联系。</p><button class="btn primary" id="homeAsk">和墨痕一起发现</button></section></div>'}
function expPage(){return '<div class="page-kicker">EXP · 探索工作台</div><h1 class="page-title">让问题带着我们穿过时间与空间</h1><p class="page-lead">围绕一个问题组织叙事、关系与证据。当前舞台保持主位，证据按需展开。</p><div class="exp-layout"><section class="exp-stage"><div class="exp-stage-top"><span class="pill">当前探索 · 问题与对象</span><button class="btn small" id="askPage">问墨痕</button></div><h2 class="exp-question">河道变迁如何影响城市的交通、市场与日常生活？</h2><div class="exp-canvas"><div class="exp-node"><b>空间变化</b><span>河道、岸线与聚落位置</span></div><div class="exp-node"><b>生活联系</b><span>交通、贸易与日常活动</span></div></div><div class="section-head"><h2>探索叙事</h2><p>随当前问题与焦点对象展开</p></div><p class="page-lead">从空间变化开始，继续核对同时代地方记载、地图与具体生活场景。关系成立与否，需要回到来源和证据。</p><div class="actions"><button class="btn soft" id="showEvidence">查看证据</button><button class="btn primary" id="toStudio">带入Studio</button></div></section><aside class="exp-side"><section class="panel-card"><h3>墨痕叙事</h3><div class="panel-tabs"><button class="active">展开</button><button>轻提示</button><button>收起</button></div><p>墨痕围绕当前问题组织解释，保留事实、推断与未知之间的区别。</p></section><section class="panel-card"><h3>证据与来源</h3><div class="panel-tabs"><button class="active">关闭</button><button id="evidencePeek">概览</button><button id="evidenceOpen">展开</button></div><p id="evidenceText">按需查看来源版本、材料身份、证据关系与使用限制。</p></section><section class="panel-card"><h3>探索会话</h3><p>当前问题、焦点对象与返回位置共同构成继续探索的锚点。</p><button class="btn small" id="askPage">继续询问</button></section></aside></div>'}
function studioPage(){return '<div class="page-kicker">STUDIO · 研究室与创作编辑部</div><h1 class="page-title">从一句委托开始，让研究逐步形成作品</h1><p class="page-lead">当前工作台保留对话委托、研究进展与作品构思三个既有工作区域。专业生产过程由墨痕组织，用户处理自己的判断和授权。</p><div class="studio-topline"><div class="studio-stages"><span class="active">对话与构思</span><span>受托研究与编导</span><span>预览与修改</span><span>审核与发布</span></div><button class="btn small" id="askPage">问墨痕</button></div><div class="studio-workspace"><section class="studio-col"><div class="studio-col-head"><h3>和墨痕说话</h3><small>想做什么，直接说</small></div><textarea class="studio-input" placeholder="我想研究……并做成一部作品"></textarea><div class="actions"><button class="btn primary" id="sendStudio">开始委托</button><button class="btn" id="draftDrawer">研究底稿</button></div><div class="studio-research-item"><b>以往研究档案</b><p>查看并继续已有项目与研究任务。</p></div></section><section class="studio-col"><div class="studio-col-head"><h3>研究进展</h3><small>研究发现与材料组织</small></div><div class="studio-empty">表达创作目标后，墨痕将在这里呈现研究方向、材料来源、证据判断、发现与待解决问题。</div><div class="studio-research-item"><b>材料与来源</b><p>来源身份、权利状态、材料关联与当前缺口。</p></div><div class="studio-research-item"><b>认识形成</b><p>事实、解释、争议、反证与未知。</p></div><div class="studio-research-item"><b>研究成果</b><p>可复用知识工作成果与研究记录。</p></div></section><section class="studio-col"><div class="studio-col-head"><h3>作品构思</h3><small>从研究走向表达</small></div><div class="studio-asset"><b>导演方案</b><p>研究形成后，比较具有真实差异的表达方向。</p></div><div class="studio-asset"><b>作品结构与分镜</b><p>章节、叙事节奏、画面、旁白与引用依据。</p></div><div class="studio-asset"><b>作品修订</b><p>保存版本、继续修改，并在准备好后提交审核。</p></div></section></div>'}
function adminPage(){const items=["运行概览","资格审核","作品审核","发布管理","知识资产","权限与撤权","用户管理","数据统计","系统设置"];return '<div class="page-kicker">ADMIN · 平台治理</div><h1 class="page-title">治理工作台</h1><p class="page-lead">围绕资格、作品、知识资产、权限与平台运行开展治理。审核责任与运营责任保持分离。</p><div class="admin-layout"><aside class="admin-sidebar"><h3>治理工作区</h3>'+items.map((x,i)=>'<button class="'+(i===2?"active":"")+'" data-admin="'+i+'">'+x+'</button>').join("")+'</aside><section class="admin-content"><span class="pill">当前工作区 · 作品审核</span><h2 style="margin-top:15px">作品审核</h2><div class="admin-tabs"><button class="active">待审核</button><button>待修改</button><button>已通过</button><button>已拒绝</button></div><div class="admin-detail"><h3>选择一项提交记录</h3><p>查看精确作品修订、提交快照、来源与权利依据，并形成具名审核意见。</p><div class="admin-columns"><div class="admin-note"><b>审核依据</b><br>来源链、证据身份、权利状态、版本差异与资格要求。</div><div class="admin-note"><b>墨痕辅助</b><br>归纳材料、比较修订、指出缺口并准备可审阅建议。</div></div><div class="actions"><button class="btn" id="askPage">请墨痕归纳当前材料</button></div></div></section></div>'}
function watchPage(){return '<div class="page-kicker">WATCH · 作品观看</div><h1 class="page-title">观看作品</h1><p class="page-lead">以合法发布的精确作品修订为单位，沉浸阅读章节叙事，并按需查看简介、出处与依据。</p><div class="watch-layout"><section class="watch-player"><div class="watch-screen"><span class="pill">作品舞台</span><div><h2>选择一部作品，继续观看它讲述的历史</h2><p>作品画面、章节叙事与材料依据在同一观看空间中组织。</p></div></div><div class="watch-controls"><button class="btn">上一章</button><button class="btn primary">继续阅读</button><button class="btn">下一章</button></div><div class="watch-timeline"><button class="active">01 · 开篇</button><button>02 · 时空背景</button><button>03 · 人与生活</button></div></section><aside class="watch-side"><h3>作品信息</h3><div class="watch-tabs"><button class="active">作品简介</button><button>相关探索</button><button>依据</button><button>引用</button></div><div class="watch-item"><b>作品目录</b><span>选择已发布作品，按修订版本进入观看。</span></div><div class="watch-item"><b>章节与时码</b><span>章节位置、叙事节奏与当前阅读进度。</span></div><div class="watch-item"><b>来源与依据</b><span>查看作品公开引用和可消费的材料信息。</span></div><button class="btn small" id="askPage">问墨痕：解释当前章节</button></aside></div>'}
function personalPage(){return '<div class="page-kicker">PERSONAL · 我的空间</div><h1 class="page-title">我的历史脉络</h1><p class="page-lead">把探索、创作、观看和主动保存的线索收在一起。个人资料的可见范围与墨痕可读范围由本人控制。</p><div class="personal-overview"><section class="personal-card"><h3>继续探索</h3><p>恢复最近的探索问题、对象焦点与返回位置。</p><button class="btn small" data-enter="exp">进入探索</button></section><section class="personal-card"><h3>我的项目</h3><p>继续研究底稿、项目任务与作品形成过程。</p><button class="btn small" data-enter="studio">进入Studio</button></section><section class="personal-card"><h3>我的作品</h3><p>查看本人创作的作品修订与公开发布状态。</p><button class="btn small" data-enter="watch">查看作品</button></section></div><div class="personal-lower"><section class="personal-panel"><h3>收藏与个人笔记</h3><div class="personal-row">主动保存的历史对象与材料<span>本人可见 · 可按对象和主题整理</span></div><div class="personal-row">个人观察与研究笔记<span>默认私人 · 不自动进入墨痕上下文</span></div><div class="personal-row">个人知识集与贡献记录<span>私人资产不自动成为正式知识资产</span></div></section><section class="personal-panel"><h3>我的数据与授权</h3><p class="page-lead">控制哪些个人资料可以被墨痕读取、用于某次研究或跨项目继续。授权可查看、撤回和清除。</p><button class="btn" id="askPage">了解墨痕的记忆与授权</button></section></div>'}
function draw(){drawNav();let content=current==="home"?homePage():current==="exp"?expPage():current==="studio"?studioPage():current==="admin"?adminPage():current==="watch"?watchPage():personalPage();page.innerHTML='<div class="page-kicker">'+pages[current].name+' · '+pages[current].label+'</div>'+content.replace('<div class="page-kicker">'+({home:"MOHEN · 历史文化世界",exp:"EXP · 探索工作台",studio:"STUDIO · 研究室与创作编辑部",watch:"WATCH · 作品观看",admin:"ADMIN · 平台治理",personal:"PERSONAL · 我的空间"})[current]+'</div>','');document.querySelectorAll("[data-enter]").forEach(b=>b.onclick=()=>go(b.dataset.enter));document.querySelectorAll("[data-go]").forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.go)});document.getElementById("askPage")?.addEventListener("click",openAgent);document.getElementById("enterExp")?.addEventListener("click",()=>go("exp"));document.getElementById("homeAsk")?.addEventListener("click",openAgent);document.getElementById("toStudio")?.addEventListener("click",()=>go("studio"));document.getElementById("showEvidence")?.addEventListener("click",()=>{document.getElementById("evidenceText").textContent="来源版本、材料身份、证据关系与使用限制。";});document.getElementById("evidencePeek")?.addEventListener("click",()=>{document.getElementById("evidenceText").textContent="证据概览：来源、材料身份与当前关系。";});document.getElementById("evidenceOpen")?.addEventListener("click",()=>{document.getElementById("evidenceText").textContent="展开证据：查看来源版本、定位、关系依据、限制与尚未解决的缺口。";});document.querySelectorAll("[data-admin]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-admin]").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelector(".admin-content h2").textContent=b.textContent;document.querySelector(".admin-content .pill").textContent="当前工作区 · "+b.textContent;});document.getElementById("sendStudio")?.addEventListener("click",()=>{let v=document.querySelector(".studio-input").value.trim();if(v){context.question=v;agentSay("我先理解你的创作目标，再整理研究方向、材料来源和需要你判断的关键问题。");openAgent();}});document.getElementById("draftDrawer")?.addEventListener("click",()=>{agentSay("研究底稿用于恢复已有项目与研究任务。项目身份、任务和作品修订保持可追溯。");openAgent()});}
function updateAgent(){const p=pages[current];document.getElementById("agentContext").textContent="页面："+p.name+"｜角色："+roleName()+"｜当前对象："+context.object+"｜任务："+context.question+"｜来源："+context.origin+"｜返回："+context.returnTo;document.getElementById("agentMode").textContent=muted?"已静音 · 仅响应主动询问":offline?"暂时不可用 · 保留当前页面":p.label+" · 情境服务";document.getElementById("serviceState").textContent=offline?"服务暂不可用":"服务可用";document.getElementById("agentLead").textContent="当前情境";document.getElementById("agentReply").textContent=p.observation;document.getElementById("agentSteps").innerHTML='<div class="agent-step"><b>我如何理解</b><p>'+p.interpretation+'</p></div><div class="agent-step"><b>可以继续</b><p>'+p.next.join("；")+'</p></div>';document.getElementById("agentActions").innerHTML=p.next.map((x,i)=>'<button data-agent-action="'+i+'">'+x+'</button>').join("");document.querySelectorAll("[data-agent-action]").forEach(b=>b.onclick=()=>{let i=Number(b.dataset.agentAction);if(current==="exp"&&i===1)go("studio");else if(current==="watch"&&i===1)go("exp");else if(current==="home")go("exp");else agentSay("我会围绕当前页面、对象和你的权限继续处理；需要跨页时会保留返回位置。")});}
function agentSay(s){document.getElementById("agentReply").textContent=s;document.getElementById("agentLead").textContent="墨痕回应"}
function openAgent(){if(muted){muted=false;document.getElementById("mute").textContent="静音"}document.getElementById("agentPreview").classList.remove("show");document.getElementById("agentPanel").classList.add("open");updateAgent();document.getElementById("ask").focus()}
function closeAgent(){document.getElementById("agentPanel").classList.remove("open");document.getElementById("agentToggle").focus()}
document.getElementById("agentToggle").onclick=openAgent;document.getElementById("closeAgent").onclick=closeAgent;document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(document.getElementById("agentPanel").classList.contains("open"))closeAgent();else document.getElementById("agentPreview").classList.remove("show")}});
document.getElementById("mute").onclick=()=>{muted=!muted;document.getElementById("mute").textContent=muted?"恢复提示":"静音";document.getElementById("agentMode").textContent=muted?"已静音 · 仅响应主动询问":pages[current].label+" · 情境服务";document.getElementById("agentPreview").classList.remove("show")};
document.getElementById("showContext").onclick=()=>{document.getElementById("agentContext").textContent+="｜服务范围：当前页面、对象修订、任务、purpose、scope、rights；目标页面重新核验权限。"};
document.getElementById("askForm").onsubmit=e=>{e.preventDefault();let v=document.getElementById("ask").value.trim();if(!v)return;document.getElementById("ask").value="";if(offline){agentSay("当前服务暂不可用。页面内容仍可继续查看；这次请求没有执行。");return}agentSay("围绕“"+v+"”，我会先核对当前对象、来源与权限，再给出有依据的解释或下一步。");};
document.getElementById("role").onchange=e=>{role=e.target.value;if(current==="admin"&&!permitted("admin"))current="home";if(current==="studio"&&!permitted("studio"))current="home";if(current==="personal"&&!permitted("personal"))current="home";draw();updateAgent()};
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.go)});
document.getElementById("agentPreview").onclick=e=>{if(e.target.tagName==="BUTTON")return;openAgent()};
draw();updateAgent();document.getElementById("agentPreview").classList.add("show");document.getElementById("personalShortcut").onclick=()=>go("personal");
</script></body></html>
