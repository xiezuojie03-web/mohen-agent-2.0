<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f7f2">
<title>墨痕 MoHen 2.0｜全局体验底座</title>
<style>
:root{--paper:#f6f7f2;--paper2:#edf2ed;--surface:#fffefa;--ink:#203b39;--muted:#71817b;--line:#dbe3dc;--teal:#2b625c;--teal-soft:#e2eee7;--deep:#173f3c;--green:#6d8c7e;--shadow:0 16px 42px #183b3518;--serif:"Noto Serif SC","Songti SC",serif;--sans:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}button,select,input,textarea{font:inherit}button,a,select{cursor:pointer}a{color:inherit;text-decoration:none}
.top{height:70px;display:flex;align-items:center;gap:28px;padding:0 4vw;background:#fbfcf8ed;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;backdrop-filter:blur(16px)}
.brand{font:600 25px var(--serif);white-space:nowrap}.brand small{font:11px var(--sans);color:var(--muted);margin-left:9px;letter-spacing:.14em}
.nav{display:flex;align-items:center;gap:5px;flex:1}.nav button,.account{border:0;background:transparent;color:#64756f;padding:10px 14px;border-radius:24px}.nav button.active{background:var(--teal-soft);color:var(--deep);font-weight:650}.nav button:hover,.account:hover{background:#edf2ed}
.role{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.role select{border:1px solid var(--line);background:white;padding:8px 10px;border-radius:9px;color:var(--ink);max-width:150px}
main{min-height:calc(100vh - 280px)}.page-shell{max-width:1200px;margin:auto;padding:clamp(44px,8vw,100px) 4vw 100px}
.page-kicker{font-size:11px;letter-spacing:.18em;color:#6c887e;text-transform:uppercase}.page-title{font:600 clamp(32px,5vw,54px)/1.3 var(--serif);margin:16px 0 20px}.page-lead{font-size:15px;line-height:2;color:#62716b;max-width:780px}
.placeholder{margin-top:46px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fffefa,#f0f4ef);padding:clamp(22px,4vw,38px);display:flex;align-items:flex-start;gap:18px;max-width:850px}
.placeholder-mark{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft);color:var(--deep);font:600 20px var(--serif)}
.placeholder h2{font:600 19px var(--serif);margin:0 0 8px}.placeholder p{font-size:13px;line-height:1.9;color:var(--muted);margin:0}
.scope-line{margin-top:20px;color:#789087;font-size:11px;letter-spacing:.04em}
.global-footer{background:#edf1eb;border-top:1px solid var(--line);padding:34px 4vw 26px}.footer-inner{max-width:1200px;margin:auto;display:grid;grid-template-columns:1.2fr 1fr;gap:34px}.footer-brand{font:600 23px var(--serif)}.footer-brand small{font:11px var(--sans);letter-spacing:.14em;color:var(--muted);margin-left:8px}.footer-inner p{font-size:12px;line-height:1.9;color:#718078;max-width:560px}.footer-links{display:flex;flex-wrap:wrap;gap:13px 20px;align-content:center;justify-content:flex-end;font-size:12px;color:#61736b}.footer-links a:hover{color:var(--deep);text-decoration:underline;text-underline-offset:4px}.footer-bottom{max-width:1200px;margin:22px auto 0;padding-top:15px;border-top:1px solid #dce4dc;display:flex;justify-content:space-between;gap:14px;color:#8a9890;font-size:10px}
.agent-anchor{position:fixed;right:25px;bottom:26px;z-index:60;width:54px;height:54px;border:1px solid #ffffffaa;border-radius:50%;background:var(--deep);color:#f8faf5;box-shadow:0 9px 26px #183b3530;font:600 21px var(--serif)}
.agent-anchor:hover{transform:translateY(-2px);box-shadow:0 13px 30px #183b3540}
.agent-panel{position:fixed;right:24px;bottom:92px;z-index:61;width:min(410px,calc(100vw - 28px));max-height:min(72vh,650px);display:none;flex-direction:column;border:1px solid #d5e0d8;border-radius:20px;background:#fffefa;box-shadow:var(--shadow);overflow:hidden}.agent-panel.open{display:flex}
.agent-head{display:flex;align-items:center;justify-content:space-between;padding:17px 19px;background:#edf3ee;border-bottom:1px solid var(--line)}.agent-head strong{font:600 20px var(--serif)}.agent-head small{color:var(--muted);font-size:11px}.agent-head button,.agent-tools button{border:0;background:transparent;color:#536f64;padding:6px 8px;font-size:12px}
.agent-body{padding:18px 19px;overflow:auto}.agent-context{font-size:11px;line-height:1.8;color:#74847b;background:#f3f6f1;padding:10px 12px;border-radius:10px}.agent-message{margin:16px 0}.agent-message strong{font:600 16px var(--serif)}.agent-message p{font-size:13px;line-height:1.9;color:#65746c;margin:7px 0}
.agent-input{display:flex;gap:8px;padding:13px 15px;border-top:1px solid var(--line)}.agent-input input{flex:1;min-width:0;border:1px solid var(--line);border-radius:22px;padding:10px 13px;background:white;outline-color:#7ba99b;font-size:12px}.agent-input button{border:0;border-radius:22px;background:var(--teal);color:white;padding:0 16px;font-size:12px}
.agent-tools{display:flex;align-items:center;justify-content:space-between;padding:0 18px 13px;color:#87948d;font-size:10px}
.mobilebar{display:none}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #7ba99b;outline-offset:3px}
@media(max-width:900px){.top{gap:12px;padding:0 18px}.brand{font-size:22px}.brand small{display:none}.nav button{padding:9px 10px;font-size:12px}.role select{max-width:115px}}
@media(max-width:700px){.top{height:62px;padding:0 14px}.nav{display:none}.role{margin-left:auto}.role label{display:none}.role select{max-width:108px}.page-shell{padding:48px 20px 112px}.page-title{font-size:36px}.page-lead{font-size:14px}.placeholder{margin-top:34px;padding:22px 18px}.global-footer{padding:28px 20px 100px}.footer-inner{grid-template-columns:1fr;gap:16px}.footer-links{justify-content:flex-start;gap:12px 17px}.footer-bottom{flex-direction:column}.mobilebar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fffefaed;border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.mobilebar button{border:0;background:transparent;color:#718078;border-radius:10px;padding:5px 1px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;min-width:0}.mobilebar button b{font-size:11px;font-weight:600}.mobilebar button.active{background:var(--teal-soft);color:var(--deep)}.agent-anchor{right:15px;bottom:calc(76px + env(safe-area-inset-bottom));width:48px;height:48px}.agent-panel{right:10px;bottom:calc(132px + env(safe-area-inset-bottom));width:calc(100vw - 20px);max-height:62vh}.agent-input{padding:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
<a class="brand" href="#" aria-label="墨痕首页" id="brandHome">墨痕<small>MOHEN 2.0</small></a>
<nav class="nav" id="nav" aria-label="全局主导航"></nav>
<div class="role"><button class="account" id="personalShortcut" type="button">个人空间</button><label for="role">角色</label><select id="role" aria-label="原型角色视角"><option value="visitor">访客</option><option value="creator" selected>Creator</option><option value="reviewer">Reviewer</option><option value="operator">Operator</option></select></div>
</header>
<main><div class="page-shell" id="page" aria-live="polite"></div></main>
<footer class="global-footer">
<div class="footer-inner">
<div><div class="footer-brand">墨痕<small>MOHEN 2.0</small></div><p>在广阔的历史知识中探寻当下生活的乐趣与意义。让典籍、地方、遗址、人物、器物与日常生活重新发生联系。</p></div>
<nav class="footer-links" aria-label="全局页尾导航">
<a href="#" data-go="home">发现世界 HOME</a><a href="#" data-go="exp">探索 EXP</a><a href="#" data-go="studio">创作 Studio</a><a href="#" data-go="watch">观看 WATCH</a><a href="#" data-go="admin">治理 Admin</a><a href="#" data-go="personal">个人空间</a>
</nav></div>
<div class="footer-bottom"><span>墨痕 MoHen 2.0</span><span>来源与材料权利 · 个人隐私与授权</span></div>
</footer>
<button class="agent-anchor" id="agentToggle" type="button" aria-label="唤起墨痕" title="唤起墨痕">墨</button>
<section class="agent-panel" id="agentPanel" aria-label="全局墨痕服务面板">
<header class="agent-head"><div><strong>墨痕</strong><br><small id="agentMode">全局智能服务 · 安静在场</small></div><div><button id="mute" type="button">静音提示</button><button id="closeAgent" type="button">收起</button></div></header>
<div class="agent-body"><div class="agent-context" id="agentContext"></div><div class="agent-message"><strong id="agentLead">同一个墨痕，贯穿不同工作面</strong><p id="agentReply">我会根据你当前所在位置、主动提供的上下文和当前账户权限，帮助你理解问题、发现联系并推进下一步。页面专属能力由各自工作面负责。</p></div></div>
<div class="agent-tools"><button id="showBoundary" type="button">服务与权限边界</button><span id="serviceState">等待用户询问</span></div>
<form class="agent-input" id="askForm"><input id="ask" aria-label="向墨痕提问" placeholder="围绕当前页面向墨痕提问…" autocomplete="off"><button type="submit">发送</button></form>
</section>
<nav class="mobilebar" id="mobilebar" aria-label="移动端全局导航"></nav>
<script>
const pages={
 home:{name:"HOME",label:"发现世界",owner:"PDW-01",lead:"发现世界的页面专属设计将在PDW-01中按已签收成果完成。"},
 exp:{name:"EXP",label:"探索",owner:"PDW-03",lead:"探索工作面的信息架构、双组件协同和具体体验将在PDW-03中完成。"},
 studio:{name:"Studio",label:"研究与创作",owner:"PDW-02",lead:"研究室与创作编辑部的工作空间结构将在PDW-02中独立完成。"},
 watch:{name:"WATCH",label:"观看",owner:"M5 / 后续专项授权",lead:"观看体验不在PDW-00定义；按既有M5业务合同及后续明确授权处理。"},
 admin:{name:"Admin",label:"治理",owner:"PDW-04",lead:"治理工作面的角色、审核旅程和工作区设计将在PDW-04中完成。"},
 personal:{name:"个人空间",label:"个人空间",owner:"PDW-05",lead:"个人空间的产品体验、个人资产和隐私控制将在PDW-05中完成。"}
};
const order=["home","exp","studio","watch","admin","personal"];
let current="home",role="creator",muted=false,offline=false,returnFocus=null;
const nav=document.getElementById("nav"),mobile=document.getElementById("mobilebar"),page=document.getElementById("page");
function roleName(){return {visitor:"访客",creator:"Creator",reviewer:"Reviewer",operator:"Operator"}[role]}
function allowed(k){if(k==="admin")return role==="reviewer"||role==="operator";if(k==="studio")return role==="creator";if(k==="personal")return role!=="visitor";return true}
function pageMarkup(k){const p=pages[k];return '<div class="page-kicker">MOHEN 2.0 · '+p.name+'</div><h1 class="page-title">'+p.label+'</h1><p class="page-lead">'+p.lead+'</p><section class="placeholder" aria-label="页面专属设计占位"><div class="placeholder-mark">墨</div><div><h2>页面专属设计待专项完成</h2><p>本阶段只统一全局墨痕、顶部导航、底部页尾与移动端导航。此处暂不定义本页面的信息架构、内容编排、业务组件或具体交互，避免占位内容被误认为正式设计。</p><div class="scope-line">后续归属：'+p.owner+'</div></div></section>'}
function drawNav(){nav.innerHTML="";mobile.innerHTML="";order.forEach(k=>{const p=pages[k];if(k==="admin"&&!allowed("admin"))return;if(k==="personal")return;const b=document.createElement("button");b.type="button";b.textContent=p.name;b.className=current===k?"active":"";b.onclick=()=>go(k);nav.append(b);});order.forEach(k=>{const p=pages[k];if(k==="admin"&&!allowed("admin"))return;if(k==="personal"&&!allowed("personal"))return;const b=document.createElement("button");b.type="button";b.className=current===k?"active":"";b.innerHTML="<b>"+(k==="personal"?"我":p.name)+"</b><span>"+(k==="personal"?"个人":p.label)+"</span>";b.onclick=()=>go(k);mobile.append(b);});}
function go(k){if(!pages[k])return;if(!allowed(k)){document.getElementById("agentReply").textContent=k==="admin"?"当前账户角色没有治理工作面的访问资格。导航显隐不是授权；真实访问必须由服务端再次核验。":k==="studio"?"当前原型角色不是Creator。真实访问资格必须由服务端会话和项目权限决定。":"个人空间需要登录并由本人授权。";openAgent();return;}current=k;draw();updateAgent();window.scrollTo({top:0,behavior:"smooth"});}
function draw(){drawNav();page.innerHTML=pageMarkup(current);document.querySelectorAll("[data-go]").forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.go)});}
function updateAgent(){const p=pages[current];document.getElementById("agentContext").textContent="当前页面："+p.name+" · 当前角色："+roleName()+" · 服务身份：墨痕（全局统一）";document.getElementById("agentMode").textContent=muted?"主动提示已静音 · 仍可主动询问":offline?"服务暂不可用": "全局智能服务 · 安静在场";document.getElementById("serviceState").textContent=offline?"服务暂不可用":"等待用户询问";document.getElementById("mute").textContent=muted?"恢复提示":"静音提示";}
function openAgent(){returnFocus=document.activeElement;document.getElementById("agentPanel").classList.add("open");updateAgent();document.getElementById("ask").focus();}
function closeAgent(){document.getElementById("agentPanel").classList.remove("open");if(returnFocus&&returnFocus.focus)returnFocus.focus();else document.getElementById("agentToggle").focus();}
document.getElementById("brandHome").onclick=e=>{e.preventDefault();go("home")};
document.getElementById("personalShortcut").onclick=()=>go("personal");
document.getElementById("agentToggle").onclick=openAgent;
document.getElementById("closeAgent").onclick=closeAgent;
document.getElementById("mute").onclick=()=>{muted=!muted;updateAgent();};
document.getElementById("showBoundary").onclick=()=>{document.getElementById("agentReply").textContent="墨痕是全平台唯一智能服务主体。页面和角色只影响当前可见上下文与允许动作；服务端必须重新核验身份、权限、用途、范围、来源权利和对象资格。静音只停止主动提示，不影响你主动提问。";}
document.getElementById("askForm").onsubmit=e=>{e.preventDefault();const input=document.getElementById("ask");if(!input.value.trim())return;document.getElementById("agentReply").textContent="已收到你的问题意图。此HTML仅验证全局服务入口、情境展示和用户控制；真实检索、回答、工具执行及其权限检查必须由2.0正式服务实现并单独验收。";input.value="";document.getElementById("serviceState").textContent="原型交互 · 未调用真实服务";};
document.getElementById("role").onchange=e=>{role=e.target.value;if(!allowed(current))current="home";draw();updateAgent();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("agentPanel").classList.contains("open"))closeAgent();});
draw();updateAgent();
</script>
</body></html>
