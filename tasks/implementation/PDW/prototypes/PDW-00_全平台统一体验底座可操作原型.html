ght:9px;border-radius:50%;background:#b9d8c9;border:2px solid #285b59}.agent-panel{position:fixed;z-index:19;right:28px;bottom:96px;width:min(390px,calc(100vw - 28px));max-height:min(690px,76vh);overflow:auto;background:#fffefa;border:1px solid #d5e0d8;border-radius:20px;box-shadow:0 24px 65px #1436322b;display:none}.agent-panel.open{display:flex;flex-direction:column}.agent-head{padding:17px 19px;background:var(--deep);color:#fff;border-radius:19px 19px 0 0;display:flex;justify-content:space-between;align-items:center}.agent-head small{color:#b9d1c8}.agent-body{padding:18px;overflow:auto}.context{background:#edf3ee;padding:12px;border-radius:12px;font-size:12px;line-height:1.7;color:#53665f}.bubble{margin:14px 0;padding:14px;background:#f6f4ec;border-radius:12px;font-size:13px;line-height:1.8}.agent-input{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}.agent-input input{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:10px}.agent-input button{border:0;background:var(--teal);color:white;border-radius:10px;padding:0 14px}.agent-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.agent-controls button{font-size:12px;padding:7px 10px;border:1px solid var(--line);border-radius:20px;background:white}.notice{padding:10px 13px;border-radius:10px;background:#f8f2e5;color:#76623d;font-size:12px;margin-top:12px}.mobilebar{display:none}.crumb{font-size:12px;color:var(--muted);margin-bottom:15px}.stepper{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.stepper span{border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:12px;background:#fff}.stepper span.done{background:var(--teal2);border-color:transparent}.roleline{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:18px;background:#edf2ed;font-size:11px;color:#56736a}.footer{border-top:1px solid var(--line);padding:24px 4vw;color:var(--muted);font-size:12px}.hidden{display:none!important}

</style></head><body><div class="demo">
<header class="top"><a class="brand" href="#" onclick="return false">墨痕<small>MOHEN 2.0</small></a><nav class="nav" id="nav"></nav><div class="role"><label for="role">当前角色</label><select id="role"><option value="visitor">访客</option><option value="creator" selected>Creator · 创作者</option><option value="reviewer">Reviewer · 审核</option><option value="operator">Operator · 运营</option></select></div></header>
<main class="stage"><div class="crumb" id="crumb">历史文化世界 / HOME</div><div id="page"></div></main>

<button class="agent-anchor" id="agentToggle" aria-label="唤起墨痕" title="唤起墨痕">墨</button>
<section class="agent-panel" id="agentPanel" aria-label="墨痕智能服务面板"><header class="agent-head"><div><strong>墨痕</strong><br><small id="agentMode">安静在场 · 模拟服务</small></div><div><button class="btn" id="mute">静音</button> <button class="btn" id="closeAgent">收起</button></div></header><div class="agent-body"><div class="context" id="context"></div><div class="bubble" id="agentReply">我在。你可以从当前对象继续，也可以提出新的问题。</div><div class="agent-controls"><button id="showContext">查看上下文封套</button><button id="simulateOffline">模拟服务不可用</button><button id="restoreService">恢复模拟服务</button></div><div class="notice" id="agentNotice">演示说明：不会调用真实模型、工具、项目数据或权限服务。</div></div><form class="agent-input" id="askForm"><input id="ask" placeholder="围绕当前情境继续问墨痕…" autocomplete="off"><button type="submit">发送</button></form></section>
<nav class="mobilebar" id="mobilebar"></nav></div>
<script>
const pages={
home:{name:"HOME",label:"发现漫游",tag:"进入历史文化世界",title:"从一条江，发现城市与日常生活的关系",lead:"在同一个历史文化世界里，从地方、器物、人物、典籍和遗址出发，发现过去如何塑造今天。",blocks:[["时空切片","江河与城市","一条河如何塑造一座城？"],["生活线索","器物与生活","一道菜、一件器物背后有什么历史？"],["继续发现","文明与遗迹","把同一时期的不同地方放在一起看。"]],service:"发现引导：识别当前策展主题与选中对象，提示可核验的关系或值得继续的问题。",focus:"主题：江河与城市；焦点对象：历史河道与城市生活",action:"进入探索"},
exp:{name:"EXP",label:"探索舞台",tag:"围绕问题深入",title:"同一条河，怎样连接港口、市场与普通人的生活？",lead:"探索舞台将问题、证据、时空关系和比较路径组织在一起。假说、事实、争议和未知必须明确区分。",blocks:[["问题焦点","河道变迁","当前研究问题与替代解释。"],["证据线索","地方志与地图","来源版本、定位、证据身份与限制。"],["比较路径","同时代城市","跨地域比较，不把相似当作传播关系。"]],service:"探索协作：解释证据、比较对象、指出缺口；没有证据时主动降级，不把假说说成事实。",focus:"探索问题：河道与城市生活；对象引用：demo:river@rev-3",action:"带入Studio"},
studio:{name:"Studio",label:"研究与创作",tag:"研究室与创作编辑部",title:"把一个好奇的问题，发展成有依据、可继续修改的作品",lead:"Creator在授权项目中组织研究、证据、知识工作资产、导演方案与作品修订。墨痕协助，但不代替作者决策和专业审核。",blocks:[["研究项目","松江府志中的河道与市镇","模拟 Project / Root / Task；来源和权利状态需逐项核验。"],["认识形成","证据与反证","候选观点、未知与来源修订分别呈现。"],["作品舞台","导演方案与作品修订","模拟 WorkRevision；保存、提交与发布不混为一谈。"]],service:"创作协作：在项目ACL内读取资料、解释研究进展、形成候选方案；外发、扩大预算、改历史含义、投稿须用户授权。",focus:"Project: demo-project；Root: demo-root；Task: demo-task；WorkRevision: demo-work@r2",action:"查看项目"},
watch:{name:"WATCH",label:"观看作品",tag:"合法消费与沉浸观看",title:"一部作品如何把历史材料转化为可观看的叙事？",lead:"WATCH只呈现当前合法发布、符合消费用途的精确作品修订。观看情境不是重新打开创作权限。",blocks:[["正在观看","河港与市镇","模拟已发布作品；演示不代表真实G5/发布资格。"],["作品章节","从河道到街市","按章节、叙事节奏和材料出处继续观看。"],["回到探索","来源与延伸问题","从作品引用进入合法可读的探索对象。"]],service:"观看陪伴：解释作品中的术语、章节和已公开出处；不读取创作者私有项目，不绕过作品许可。",focus:"公开消费上下文：demo-watch-work@r2；用途=观看（模拟）",action:"继续观看"},
admin:{name:"Admin",label:"治理工作面",tag:"审核与治理",title:"审核不是替作者创作，而是判断提交对象是否符合治理要求",lead:"仅授权Reviewer/Operator可见相应治理任务。墨痕辅助归纳证据、指出差异和缺口，不能代签、代批或改变资格。",blocks:[["待审事项","作品修订与提交快照","展示精确WorkRevision和提交材料。"],["审核依据","来源、资格与权利","核对证据、限制和独立审查意见。"],["治理动作","通过、退回或撤回","关键动作由具名角色明确执行并留痕。"]],service:"治理辅助：按当前Reviewer/Operator权限归纳材料、比对修订、提示遗漏；不能签发Gate或代替独立Reviewer。",focus:"角色权限：Reviewer/Operator；目标：submission snapshot（模拟）",action:"查看审核依据"},
personal:{name:"个人空间",label:"个人空间",tag:"我的历史探索",title:"把探索、收藏、笔记与创作项目，连成自己的长期脉络",lead:"个人空间是用户长期连续性的私人工作面。哪些内容可被墨痕读取、用于推荐或跨项目复用，由用户逐项控制。",blocks:[["我的探索","最近走过的时空","最近浏览和主动保存的探索对象。"],["收藏与笔记","一条河的不同看法","收藏、私人笔记、观察与待继续问题。"],["项目与作品","继续上次的研究","按用户授权恢复项目，不自动共享给其他角色。"]],service:"个人助理：帮助整理用户主动保存的探索、收藏、笔记和项目；默认不把浏览轨迹转为兴趣画像，不跨项目共享私有资料。",focus:"私有个人数据域；当前演示仅有模拟摘要",action:"整理我的线索"}
};
const order=["home","exp","studio","watch","admin","personal"];let current="home",role="creator",muted=false,offline=false,context={origin:"HOME",object:"demo:river@rev-3",question:"一条河如何塑造一座城？",trail:["HOME"]};
const nav=document.getElementById("nav"),mobile=document.getElementById("mobilebar"),page=document.getElementById("page");
function permitted(p){if(p==="admin")return ["reviewer","operator"].includes(role);if(p==="studio")return role==="creator";if(p==="personal")return role!=="visitor";return true}
function drawNav(){nav.innerHTML="";mobile.innerHTML="";order.filter(k=>k!=="admin"||["reviewer","operator"].includes(role)).forEach(k=>{const b=document.createElement("button");b.textContent=pages[k].name;b.className=current===k?"active":"";b.onclick=()=>go(k);nav.append(b);const m=document.createElement("button");m.innerHTML="<b>"+pages[k].name+"</b><span>"+pages[k].label+"</span>";m.className=current===k?"active":"";m.onclick=()=>go(k);mobile.append(m)});}
function go(k){if(!permitted(k)){reply("当前角色没有Admin访问权限。请切换到获授权的Reviewer或Operator；不能通过墨痕绕过权限。");return}current=k;context.trail.push(pages[k].name);draw();if(document.getElementById("agentPanel").classList.contains("open"))updateAgent();}
function draw(){const p=pages[current];document.getElementById("crumb").textContent="历史文化世界 / "+p.name+" / "+p.label;drawNav();page.innerHTML=`
<div class="eyebrow">${p.tag} · ${p.name}</div><h1 class="headline">${p.title}</h1><p class="sub">${p.lead}</p>
<div class="hero"><div class="hero-copy"><span class="roleline">当前角色：${({visitor:"访客",creator:"Creator · 创作者",reviewer:"Reviewer · 审核",operator:"Operator · 运营"})[role]}</span><h2 class="headline" style="font-size:27px">让历史回到时间、空间与人的生活之中</h2><p class="copy">${p.service}</p><div class="actions"><button class="btn primary" id="primaryAction">${p.action}</button><button class="btn soft" id="askHere">就当前页面问墨痕</button></div></div><div class="hero-art"><strong>${p.name==="HOME"?"时间 × 空间 × 生活":p.name==="EXP"?"证据 × 关系 × 比较":p.name==="Studio"?"研究 × 认识 × 创作":p.name==="WATCH"?"作品 × 叙事 × 观看":p.name==="Admin"?"资格 × 权利 × 治理":"探索 × 收藏 × 记忆"}</strong><span>一个世界，不同的工作面；统一的墨痕，适配不同的情境。</span></div></div>
<div class="grid">${p.blocks.map((b,i)=>`<article class="tile"><div class="section-label">${b[0]}</div><h3>${b[1]}</h3><p>${b[2]}</p><button class="btn" data-object="${i}">查看线索</button></article>`).join("")}</div>
<div class="workspace"><section class="mainpanel"><div class="section-label">当前工作面 · ${p.name}</div><h2>${p.label}的专属内容舞台</h2><p class="copy">${p.lead}</p><div class="stepper"><span class="done">对象与问题</span><span class="done">当前情境</span><span>下一步探索</span></div><div class="object"><div class="object-mark"></div><div><b>${context.object}</b><small>模拟对象引用 · 仅用于演示跨页面上下文，不代表真实知识资产或资格</small></div></div><div class="notice">交互演示：页面内容、角色、对象引用和状态均为模拟数据；此原型不访问真实业务API、数据库、Agent或权限系统。</div></section><aside class="sidepanel"><h3>页面情境</h3><p>${p.service}</p><p><b>墨痕识别：</b><br>${p.focus}</p><button class="btn" id="openAgent">打开墨痕服务</button></aside></div>`;
document.getElementById("primaryAction").onclick=()=>{if(current==="home")go("exp");else if(current==="exp"){context={...context,origin:"EXP"};go("studio")}else if(current==="studio")reply("项目总览为模拟状态；真实项目仍须通过服务端Owner/Project ACL验证。");else if(current==="admin")reply("审核动作只作说明；原型不执行批准、退回、发布或撤回。");else if(current==="watch")reply("当前作品播放与发布资格均为模拟状态。");else reply("个人数据整理为模拟状态；不会读取真实个人数据。")};
document.getElementById("askHere").onclick=openAgent;document.getElementById("openAgent").onclick=openAgent;document.querySelectorAll("[data-object]").forEach(b=>b.onclick=()=>{context.object="demo:"+current+"-object-"+b.dataset.object+"@rev-1";updateAgent();reply("已将当前演示对象设为墨痕焦点。跨页只携带对象引用和必要任务信息，不携带完整私聊记录。")});
}
function updateAgent(){const p=pages[current];document.getElementById("context").textContent="页面："+p.name+"｜角色："+role+"｜对象："+context.object+"｜任务："+context.question+"｜来源："+context.origin+"｜上下文轨迹："+context.trail.join(" → ");document.getElementById("agentMode").textContent=(muted?"已静音":offline?"服务不可用（模拟）":p.name+" · 情境服务（模拟）");}
function openAgent(){document.getElementById("agentPanel").classList.add("open");updateAgent();if(muted){muted=false;document.getElementById("mute").textContent="静音";updateAgent()}document.getElementById("ask").focus()}
function reply(s){document.getElementById("agentReply").textContent=s;document.getElementById("agentPanel").classList.add("open");updateAgent()}
document.getElementById("agentToggle").onclick=openAgent;document.getElementById("closeAgent").onclick=()=>document.getElementById("agentPanel").classList.remove("open");document.getElementById("mute").onclick=()=>{muted=!muted;document.getElementById("mute").textContent=muted?"恢复提示":"静音";document.getElementById("agentMode").textContent=muted?"已静音 · 仅响应主动唤起":pages[current].name+" · 情境服务（模拟）";document.getElementById("agentReply").textContent=muted?"墨痕已静音，不再主动提示。你仍可主动唤起。":"墨痕已恢复安静在场。"};
document.getElementById("showContext").onclick=()=>{document.getElementById("context").textContent+="｜封套规则：actor/role + page + object_ref@revision + task_ref + purpose + scope + rights + consent + expiry。仅为设计示意。"};
document.getElementById("simulateOffline").onclick=()=>{offline=true;document.getElementById("agentMode").textContent="服务不可用（模拟）";document.getElementById("agentReply").textContent="墨痕服务暂时不可用。已保存页面内容仍可查看；不会假装任务已执行。请稍后重试。"};
document.getElementById("restoreService").onclick=()=>{offline=false;updateAgent();document.getElementById("agentReply").textContent="模拟服务已恢复。当前页面与对象上下文仍在。"};
document.getElementById("askForm").onsubmit=e=>{e.preventDefault();const v=document.getElementById("ask").value.trim();if(!v)return;document.getElementById("ask").value="";if(offline){reply("服务不可用：问题已保留在演示界面，没有发送到任何服务。");return}reply("【模拟回应】围绕“"+v+"”，我会先核对当前对象的来源、证据和权限，再决定是否能比较或继续行动。这里不代表真实Agent输出。")};
document.getElementById("role").onchange=e=>{role=e.target.value;if(current==="admin"&&!permitted("admin"))current="home";draw();updateAgent();};
draw();updateAgent();
</script></body></html>
