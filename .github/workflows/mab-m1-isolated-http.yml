name: MAB M1 isolated authenticated HTTP acceptance

# Real Next.js + Chromium HTTP E2E against a disposable, explicitly marked
# PostgreSQL 17 instance. Synthetic users only; NO production credentials,
# cloud Storage, paid model calls, or outside database sockets.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mab-m1-isolated-http.yml"
      - "scripts/test-mab-http.mjs"
      - "apps/web/app/studio/desk/ResearchPlan.tsx"
      - "apps/web/app/studio/desk/ProjectNotebook.tsx"
      - "apps/web/lib/studio-plans.ts"
      - "playwright.mab.config.ts"
      - "tests/e2e/mab-notebook.spec.ts"
      - "tests/e2e/mab-m4-plan.spec.ts"
      - "tests/e2e/mab-m5-public-consumers.spec.ts"
      - "apps/web/app/api/public/works/**"
      - "apps/web/app/api/search/route.ts"
      - "apps/web/lib/publication.ts"
      - "apps/web/lib/work-publish-qualification.ts"
      - "apps/web/lib/mohen-agent/retrieve.ts"
      - "apps/web/app/api/mohen/materials/route.ts"
      - "apps/web/app/api/mohen/ask/route.ts"
      - "apps/web/app/api/explore/search/route.ts"
      - "supabase/migrations/*_mab_m4_execution_controls.sql"
      - "tests/e2e/mab-browser-request.ts"
      - "tests/e2e/private-original-http.spec.ts"
      - "tests/e2e/mab-m1-session-revocation.spec.ts"
      - "apps/web/app/api/auth/**"
      - "apps/web/app/api/studio/**"
      - "apps/web/lib/auth/**"
      - "apps/web/lib/studio/**"
      - "apps/web/lib/studio-research.ts"
      - "packages/data-access/src/**"
      - "apps/web/lib/auth.ts"
      - "apps/web/app/components/GlobalNav.tsx"
      - "apps/web/app/admin/AdminWorkbench.tsx"
      - "supabase/migrations/*_mab_web_session_revocation.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-m1-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MOHEN_REVOCABLE_SESSIONS_ENABLED: "true"
      MOHEN_TEST_PSQL: /usr/bin/psql
      MOHEN_TEST_SOCKET: /workspace/mab-m1-http-pg
      MOHEN_TEST_PORT: "55432"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies and local browser
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          pnpm exec playwright install --with-deps chromium
          sudo install -d -m 0777 "$MOHEN_TEST_SOCKET"
      - name: Start disposable locally isolated PostgreSQL 17
        run: |
          docker run --detach --name mohen-m1-http-pg17 \
            --mount type=bind,src="$MOHEN_TEST_SOCKET",dst=/var/run/postgresql \
            --env POSTGRES_USER=k3_admin \
            --env POSTGRES_PASSWORD=synthetic-fixture-only \
            --env POSTGRES_DB=postgres \
            postgres:17 -c port=55432 -c mohen.test_instance=codex-k3-isolated
          for i in $(seq 1 60); do
            if pg_isready -h "$MOHEN_TEST_SOCKET" -p "$MOHEN_TEST_PORT" -U k3_admin; then exit 0; fi
            sleep 2
          done
          docker logs mohen-m1-http-pg17
          exit 1
      - name: Assert synthetic instance marker and run actual HTTP/browser suite
        run: |
          test "$(psql -X -At -h "$MOHEN_TEST_SOCKET" -p "$MOHEN_TEST_PORT" -U k3_admin -d postgres -c "select current_setting('mohen.test_instance',true)")" = "codex-k3-isolated"
          unset MOHEN_TEST_STORAGE_CONFIG
          unset DATABASE_URL
          unset DEEPSEEK_API_KEY
          unset SHANGHAI_LIBRARY_KEY
          pnpm test:mab:http
      - name: Remove disposable database
        if: always()
        run: |
          docker rm -f mohen-m1-http-pg17 2>/dev/null || true
          sudo rm -rf "$MOHEN_TEST_SOCKET"
