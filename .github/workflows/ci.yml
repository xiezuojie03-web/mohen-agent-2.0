name: ci

on:
  push:
    branches: ["a001/production", "main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests (no DB)
        run: pnpm test:unit

      - name: Production boundary regression (no DB)
        run: pnpm test:data-production

      - name: K3 requirement traceability
        run: pnpm guard:k3-traceability

      - name: Build
        run: pnpm build

      # 静态覆盖不是运行安全证明；完整DB角色/RLS测试仍是独立门。
      - name: Auth coverage gate
        run: node scripts/check-auth-coverage.mjs --strict --out /tmp/k3-auth-coverage.csv

      # 说明：数据库集成测试（pnpm test）需要本机 PostgreSQL 快照，暂不在 CI 跑；
      # 待 P0-6 把旧套件隔离、新增无库单测后再接入。
