name: ci

on:
  push:
    branches: ["a001/production", "main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: MHKA engineering authority routing guard
        run: node scripts/guards/check-authority-routing.mjs

      # Collect actual HTTP/Chromium test specifications without connecting to
      # PostgreSQL or launching a browser. Reject syntax/registration failures
      # early; this does NOT count as HTTP or browser acceptance.
      - name: Playwright isolated specifications parse (no DB/browser)
        run: pnpm exec playwright test --config=playwright.mab.config.ts --list

      - name: Unit tests (no DB)
        run: pnpm test:unit

      - name: Production boundary regression (no DB)
        run: pnpm test:data-production

      - name: K3 requirement traceability
        run: pnpm guard:k3-traceability

      - name: Build
        run: pnpm build

      # 静态覆盖不是运行安全证明；完整DB角色/RLS测试仍是独立门。
      - name: Auth coverage gate
        run: node scripts/check-auth-coverage.mjs --strict --out /tmp/k3-auth-coverage.csv

      # HP13 readiness is informational until every exact target and live Gate
      # has its own evidence. Presence is NOT semantic equivalence.
      - name: MAB 74 target handoff audit (informational)
        run: node scripts/audit-mab-handoff-targets.mjs --out /tmp/mab-target-audit.json

      - name: Upload MAB target audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mab-hp13-target-readiness
          path: /tmp/mab-target-audit.json
          if-no-files-found: warn

      # 说明：数据库集成测试（pnpm test）需要本机 PostgreSQL 快照，暂不在 CI 跑；
      # 待 P0-6 把旧套件隔离、新增无库单测后再接入。
