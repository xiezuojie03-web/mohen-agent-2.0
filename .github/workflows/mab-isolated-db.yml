name: MAB isolated PostgreSQL 17 verification

# Synthetic data only. No cloud database, no external Storage, and no
# production environment variables. Runs only when the M2 isolated test
# contract changes; standard CI continues to cover everyday app commits.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mab-isolated-db.yml"
      - "tests/data-production/private-original-source-binding.integration.mjs"
      - "scripts/test-k3-db.mjs"
      - "supabase/migrations/202611010900_k3_independent_gate_authority.sql"
      - "tools/gate-stage-candidate-selection.mjs"
      - "tools/gate-stage-output-attestation.mjs"
      - "tools/rule-gate-reviewer.mjs"
      - "tools/local-gate-service.mjs"
      - "tests/data-production/gate-stage-candidate-selection.test.mjs"
      - "tests/data-production/gate-stage-output-attestation.test.mjs"
      - "pipelines/data-production/orchestrator/independent-stage-qualification.mjs"
      - "packages/agent-runtime/src/studio-plan.mjs"
      - "packages/data-access/src/studio-receive-candidate.mjs"
      - "packages/data-access/src/studio-execution-repository.mjs"
      - "tests/data-production/studio-execution.integration.mjs"
      - "tests/integration/studio-plan.integration.ts"
      - "apps/web/lib/studio-plans.ts"
      - "supabase/migrations/*_mab_m4_execution_controls.sql"
      - "supabase/rollback/*_mab_m4_execution_controls.rollback.sql"
      - "packages/data-access/src/gate-service-connection.mjs"
      - "pipelines/data-production/orchestrator/independent-gate-service*.mjs"
      - "pipelines/data-production/orchestrator/bounded-gate-request.mjs"
      - "tests/data-production/gate-service.integration.mjs"
      - "supabase/migrations/*_mab_m3_gate_service_auth.sql"
      - "supabase/rollback/*_mab_m3_gate_service_auth.rollback.sql"
      - "packages/data-access/src/studio-delegation-repository.mjs"
      - "packages/data-access/src/studio-candidate-assessment.mjs"
      - "tests/data-production/studio-delegation.integration.mjs"
      - "supabase/migrations/20261102105810_mab_studio_assets.sql"
      - "apps/web/lib/studio-research.ts"
      - "tests/integration/research-resume.integration.ts"
      - "vitest.research-db.config.ts"
      - "packages/data-access/src/gate-authority-repository.mjs"
      - "packages/data-access/src/gate-stage-qualification.mjs"
      - "packages/data-access/src/private-worker-pool.mjs"
      - "packages/data-access/src/private-text-reading-repository.mjs"
      - "pipelines/data-production/workers/private-evidence-stage.mjs"
      - "pipelines/data-production/workers/private-evidence-binding.mjs"
      - "pipelines/data-production/adapters/private-evidence-adapters.mjs"
      - "tests/data-production/private-text-reading.integration.mjs"
      - "tests/data-production/evidence-bridge.integration.mjs"
      - "supabase/migrations/*_mab_m2_private_text_reading.sql"
      - "supabase/migrations/*_mab_m5_private_text_read_context_consistency.sql"
      - "supabase/rollback/*_mab_m2_private_text_reading.rollback.sql"
      - "pipelines/data-production/workers/private-evidence-runtime.mjs"
      - "pipelines/data-production/orchestrator/independent-gate-current-handler.mjs"
      - "pipelines/data-production/orchestrator/independent-gate-decision-handler.mjs"
      - "tests/data-production/gate-authority.integration.mjs"
      # M3 producer legal-input and lineage reads use live G0-G5 scope
      # qualification; only disposable PG17 can prove recursive invalidation.
      - "packages/data-access/src/qualification-read-context.mjs"
      - "packages/data-access/src/data-production-repository.mjs"
      - "packages/data-access/src/read-model-repository.mjs"
      - "packages/data-access/src/work-qualification-reader.mjs"
      - "tests/data-production/studio-asset-repository.integration.mjs"
      - "packages/data-access/src/lineage-validator.mjs"
      - "tests/data-production/read-model-qualification.integration.mjs"
      - "tests/data-production/work-g5-facets.integration.mjs"
      - "tests/integration/work-g5-binding.integration.ts"
      - "vitest.work-binding-db.config.ts"
      - "tests/fixtures/mab-work-g5.mjs"
      - "apps/web/lib/mohen-agent/retrieve.ts"
      - "tests/integration/qualified-retrieve.integration.ts"
      - "vitest.qualified-retrieve-db.config.ts"
      - "tests/data-production/web-session-revocation.integration.mjs"
      - "supabase/migrations/*_mab_web_session_revocation.sql"
      - "supabase/rollback/*_mab_web_session_revocation.rollback.sql"
      - "supabase/migrations/20261102145410_mab_m2_evidence_bridge.sql"
      - "supabase/rollback/20261102145410_mab_m2_evidence_bridge.rollback.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile
      - name: PostgreSQL client and isolated socket directory
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          sudo install -d -m 0777 /workspace/mab-isolated-pg
          node --check tests/data-production/private-original-source-binding.integration.mjs
          node --check scripts/test-k3-db.mjs
      - name: Start disposable PostgreSQL 17 with non-production marker
        run: |
          docker run --detach --name mohen-mab-pg17 \
            --mount type=bind,src=/workspace/mab-isolated-pg,dst=/var/run/postgresql \
            --env POSTGRES_USER=k3_admin \
            --env POSTGRES_PASSWORD=isolated-fixture-only \
            --env POSTGRES_DB=postgres \
            postgres:17 \
            -c port=55432 \
            -c mohen.test_instance=codex-k3-isolated
          for i in $(seq 1 60); do
            if pg_isready -h /workspace/mab-isolated-pg -p 55432 -U k3_admin; then exit 0; fi
            sleep 2
          done
          docker logs mohen-mab-pg17
          exit 1
      - name: Execute original K3/M2 database suite in disposable PG17
        env:
          MOHEN_TEST_PSQL: /usr/bin/psql
          MOHEN_TEST_SOCKET: /workspace/mab-isolated-pg
          MOHEN_TEST_PORT: "55432"
        run: |
          test "$(psql -X -At -h "$MOHEN_TEST_SOCKET" -p "$MOHEN_TEST_PORT" -U k3_admin -d postgres -c "select current_setting('mohen.test_instance',true)")" = "codex-k3-isolated"
          pnpm test:k3-db
      - name: Cleanup isolated PostgreSQL
        if: always()
        run: |
          docker rm -f mohen-mab-pg17 2>/dev/null || true
          sudo rm -rf /workspace/mab-isolated-pg
